<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <rect width="1400" height="1000" fill="#f2f0e8"/>
  <rect x="72" y="66" width="1256" height="868" rx="24" fill="#fbf8ee" stroke="#b9a56d" stroke-width="3"/>
  <text x="118" y="128" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#8a7443">INTERACTION AND PLATFORM LAYER</text>
  <text x="118" y="196" font-family="Arial, sans-serif" font-size="52" font-weight="800" fill="#203120">Making the VR tools usable</text>
  <text x="118" y="246" font-family="Arial, sans-serif" font-size="26" fill="#40513b">Most of the work is the practical layer between the player and the fantasy.</text>
  <line x1="118" y1="292" x2="1280" y2="292" stroke="#d3c69e" stroke-width="3"/>
  <text x="118" y="358" font-family="Arial, sans-serif" font-size="31" font-weight="800" fill="#263626">Implemented pieces</text>
  <text x="150" y="418" font-family="Arial, sans-serif" font-size="27" fill="#2e3f2d">- Backpack inventory with stow anchors, delayed returns, shoulder zones, and haptics.</text>
  <text x="150" y="472" font-family="Arial, sans-serif" font-size="27" fill="#2e3f2d">- Right-shoulder camera summon for the dominant photo-taking workflow.</text>
  <text x="150" y="526" font-family="Arial, sans-serif" font-size="27" fill="#2e3f2d">- Feeding stick perch logic with one active bird, peck timing, flyaway, and cooldown.</text>
  <text x="150" y="580" font-family="Arial, sans-serif" font-size="27" fill="#2e3f2d">- Runtime comfort menu for locomotion, turn mode, vignette, credits, and FPS.</text>
  <text x="150" y="634" font-family="Arial, sans-serif" font-size="27" fill="#2e3f2d">- Hand-tracking fallback for pinch/grasp assisted grabs and teleport aiming.</text>
  <text x="150" y="688" font-family="Arial, sans-serif" font-size="27" fill="#2e3f2d">- PCVR/OpenXR path plus Android/Quest build setup and latest v5 APK output.</text>
  <rect x="118" y="760" width="1162" height="92" rx="14" fill="#efe8d2" stroke="#c8b783"/>
  <text x="150" y="815" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#263626">Known rough edges remain documented: bird material issues and final camera/backpack alignment polish.</text>
  <text x="118" y="904" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#8a7443">Source files: BackpackInventoryController.cs, BirdFeederManager.cs, VRComfortRuntimeManager.cs.</text>
</svg>
